[package]
name = "webssh"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"
description = "A lightweight Web SSH console, Rust port of the original Go version"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "4.5"
chrono = "0.4"
bcrypt = "0.19"
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
form_urlencoded = "1"
